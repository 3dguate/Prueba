<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Marvel</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Work+Sans:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rojo: #ED1D24;
    --azul: #1B3F8C;
    --amarillo: #FFD700;
    --tinta: #101010;
    --papel: #F2EEE3;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle, rgba(0,0,0,0.08) 1px, transparent 1.2px) 0 0/14px 14px,
      var(--papel);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Work Sans', sans-serif;
    color: var(--tinta);
    padding: 20px;
  }

  .cartel {
    width: 100%;
    max-width: 420px;
    background: #fff;
    border: 5px solid var(--tinta);
    border-radius: 14px;
    box-shadow: 8px 8px 0 var(--tinta);
    overflow: hidden;
  }

  .cabecera {
    background: var(--rojo);
    padding: 18px 20px;
    border-bottom: 5px solid var(--tinta);
    position: relative;
  }

  .cabecera h1 {
    font-family: 'Bangers', cursive;
    font-size: 34px;
    letter-spacing: 1px;
    color: var(--amarillo);
    -webkit-text-stroke: 1.5px var(--tinta);
    margin: 0;
    transform: rotate(-2deg);
  }

  .progreso {
    font-size: 13px;
    font-weight: 800;
    color: #fff;
    margin-top: 4px;
  }

  .cuerpo {
    padding: 24px 20px 20px;
  }

  .pregunta {
    font-size: 19px;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 18px;
  }

  .opciones {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .opcion {
    text-align: left;
    padding: 13px 16px;
    border: 3px solid var(--tinta);
    border-radius: 10px;
    background: #fff;
    font-family: 'Work Sans', sans-serif;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--tinta);
    transition: transform 0.08s ease;
  }

  .opcion:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--tinta);
  }

  .opcion.correcta {
    background: #2ECC71;
  }

  .opcion.incorrecta {
    background: var(--rojo);
    color: #fff;
  }

  .opcion:disabled {
    cursor: default;
  }

  .resultado {
    text-align: center;
    padding: 10px 4px 4px;
  }

  .resultado .boom {
    font-family: 'Bangers', cursive;
    font-size: 48px;
    color: var(--rojo);
    -webkit-text-stroke: 2px var(--tinta);
    transform: rotate(-3deg);
    margin: 0 0 6px;
  }

  .resultado .puntaje {
    font-size: 22px;
    font-weight: 800;
    margin: 0 0 4px;
  }

  .resultado .frase {
    font-size: 14px;
    color: #444;
    margin: 0 0 20px;
  }

  .reintentar {
    background: var(--azul);
    color: #fff;
    border: 3px solid var(--tinta);
    border-radius: 10px;
    padding: 12px 20px;
    font-weight: 800;
    font-size: 15px;
    cursor: pointer;
    box-shadow: 4px 4px 0 var(--tinta);
  }

  .reintentar:active {
    transform: translate(2px, 2px);
    box-shadow: 2px 2px 0 var(--tinta);
  }
</style>
</head>
<body>

<div class="cartel">
  <div class="cabecera">
    <h1>MARVEL QUIZ</h1>
    <div class="progreso" id="progreso">Pregunta 1 de 5</div>
  </div>
  <div class="cuerpo" id="cuerpo"></div>
</div>

<script>
  const preguntas = [
    {
      texto: "¿Cuál es el nombre real de Iron Man?",
      opciones: ["Tony Stark", "Steve Rogers", "Bruce Banner"],
      correcta: 0
    },
    {
      texto: "¿De qué planeta es originario Thanos?",
      opciones: ["Asgard", "Titan", "Xandar"],
      correcta: 1
    },
    {
      texto: "¿Quién es el mejor amigo de Steve Rogers desde la infancia?",
      opciones: ["Sam Wilson", "Bucky Barnes", "Peter Parker"],
      correcta: 1
    },
    {
      texto: "¿Cómo se llama el laboratorio o accidente que le da poderes a Peter Parker?",
      opciones: ["Rayos gamma", "Picadura de araña radiactiva", "Suero del supersoldado"],
      correcta: 1
    },
    {
      texto: "¿Cuál es el nombre del martillo de Thor?",
      opciones: ["Stormbreaker", "Gungnir", "Mjolnir"],
      correcta: 2
    }
  ];

  let actual = 0;
  let puntaje = 0;

  const cuerpo = document.getElementById('cuerpo');
  const progreso = document.getElementById('progreso');

  function pintarPregunta() {
    const p = preguntas[actual];
    progreso.textContent = `Pregunta ${actual + 1} de ${preguntas.length}`;

    cuerpo.innerHTML = `
      <p class="pregunta">${p.texto}</p>
      <div class="opciones">
        ${p.opciones.map((op, i) => `<button class="opcion" data-i="${i}">${op}</button>`).join('')}
      </div>
    `;

    document.querySelectorAll('.opcion').forEach(btn => {
      btn.addEventListener('click', () => responder(parseInt(btn.dataset.i)));
    });
  }

  function responder(seleccion) {
    const p = preguntas[actual];
    const botones = document.querySelectorAll('.opcion');

    botones.forEach(btn => btn.disabled = true);
    botones[p.correcta].classList.add('correcta');

    if (seleccion === p.correcta) {
      puntaje++;
    } else {
      botones[seleccion].classList.add('incorrecta');
    }

    setTimeout(() => {
      actual++;
      if (actual < preguntas.length) {
        pintarPregunta();
      } else {
        mostrarResultado();
      }
    }, 900);
  }

  function mostrarResultado() {
    progreso.textContent = "Resultado final";

    let frase = "";
    if (puntaje === 5) frase = "Nivel Vengador. Lo sabes todo.";
    else if (puntaje >= 3) frase = "Buen nivel, sigues subiendo poder.";
    else frase = "Toca ver más películas y cómics.";

    cuerpo.innerHTML = `
      <div class="resultado">
        <p class="boom">¡PUM!</p>
        <p class="puntaje">${puntaje} de ${preguntas.length} correctas</p>
        <p class="frase">${frase}</p>
        <button class="reintentar" id="reintentar">Volver a intentar</button>
      </div>
    `;

    document.getElementById('reintentar').addEventListener('click', () => {
      actual = 0;
      puntaje = 0;
      pintarPregunta();
    });
  }

  pintarPregunta();
</script>

</body>
</html>
